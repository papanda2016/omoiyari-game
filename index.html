const app=document.getElementById("app");let got={};try{got=JSON.parse(localStorage.getItem("tg")||"{}")}catch(e){}let si=0,a=0,lv=0;

function home(){

function hd(s){return `<p class="tag">${s[0]} ${s[1]}　${lf(s[2])}</p><div class="card">${s[3]}</div>`}
function scene(i){si=i;const s=S[i];

function turn2(j){a=j;const s=S[si],o=s[6][j];const b0=vis();seen[si]=1;try{localStorage.setItem("tgs",JSON.stringify(seen))}catch(e){}nu=vis()-b0;

function end(k){const s=S[si],o=s[6][a],p=o[2][k];got[si+"-"+a+"-"+k]=1;try{localStorage.setItem("tg",JSON.stringify(got))}catch(e){}
